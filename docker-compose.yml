services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: goreadwise
      POSTGRES_PASSWORD: goreadwise
      POSTGRES_DB: goreadwise
    ports:
      - "15233:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goreadwise -d goreadwise"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://goreadwise:goreadwise@postgres:5432/goreadwise?sslmode=disable
      LOG_LEVEL: info
      CLIP_PROVIDER: mock
      CLIP_FIXTURE_DIR: /app/testdata/clips
    ports:
      - "15232:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 8s
      timeout: 4s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    ports:
      - "15231:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
